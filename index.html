<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таза Қызылорда</title>
<meta name="description" content="Прототип системы экологического мониторинга и управления зелёным фондом. Хакатон 2026, кейс 01.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 38S6 27 6 16a14 14 0 0 1 28 0c0 11-14 22-14 22z' fill='%230E3B2E'/%3E%3Cpath d='M13.5 21.5c0-7 4.5-11 12.5-11.5 0 8-4 12-10.5 12h-2z' fill='%23F2B632'/%3E%3C/svg%3E">
<style>
:root{
  /* Компоновка: тёмно-зелёная шапка, слева список с фильтрами, справа карта; карточка объекта выезжает справа */
  --ink:#12261F; --ink2:#42564E; --muted:#6F8078;
  --bg:#EDF1ED; --surface:#FFFFFF; --line:#DAE2DC; --line2:#EEF2EF;
  --brand:#0E3B2E; --brand2:#14805E; --brand-soft:#E2F2EA;
  --river:#1877A8; --river-soft:#E3F0F7; --sun:#F2B632;
  --danger:#C93A2B; --danger-soft:#FBE8E5; --warn:#A86500; --warn-soft:#FBF0D8;
  --s-new:#1877A8; --s-assigned:#7453C0; --s-inwork:#D48200; --s-done:#0B95A2; --s-closed:#2C9A58; --s-rejected:#7D8B85;
  --c-good:#2C9A58; --c-fair:#8FA61C; --c-care:#E08300; --c-critical:#C93A2B;
  --font:"Geologica","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --shadow:0 8px 28px rgba(14,59,46,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- Шапка ---------- */
.top{flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;height:60px;background:var(--brand);color:#fff}
.brand{display:flex;align-items:center;gap:10px;flex:none;background:none;border:0;color:#fff;padding:0;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:11.5px;color:#A9CDBD;line-height:1.2;margin-top:2px}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:0;border-radius:8px;background:none;color:#CFE3DA;font-weight:500;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--brand)}
.nav .cnt{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.test-badge{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px dashed var(--sun);color:var(--sun);font-size:12px;font-weight:500;white-space:nowrap}
.test-badge .ic{width:14px;height:14px}
.rolebar{flex:none;display:flex;align-items:center;gap:12px;height:46px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.rb-label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rb-hint{font-size:13px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:flex;background:var(--line2);border-radius:9px;padding:3px;gap:2px;flex:none}
.role button{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--ink2);font-size:13px;font-weight:550;white-space:nowrap}
.role button:hover{color:var(--ink)}
.role button.on{background:var(--sun);color:#2A2000;box-shadow:0 1px 3px rgba(80,55,0,.25)}
.role-sel,.exec-sel{display:none;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:550;padding:0 8px;max-width:230px}
.exec-sel.d.show{display:block}
.top .role-sel,.top .exec-sel{border:0;background:var(--sun);color:#2A2000;max-width:130px}
.top .exec-sel{background:rgba(255,255,255,.14);color:#fff}
.top .exec-sel option{color:#12261F}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.1);color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.2)}

/* ---------- Области ---------- */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}
#view-map .panel{width:372px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
.mapwrap{flex:1;position:relative;min-width:0;background:#DDE5DF;overflow:hidden}
#map{position:absolute;inset:0;z-index:0;font-family:var(--font)}
.map-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink2)}
.page{overflow:auto;display:none;flex-direction:column}
.page.on{display:block}
.page-in{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
.page-in.wide{max-width:1560px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
.page-head p{color:var(--ink2);margin-top:3px;max-width:68ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Кнопки, поля ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:550;white-space:nowrap}
.btn:hover{border-color:#B9C7BF;background:#F8FAF8}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.pri:hover{background:#0F6E50}
.btn.danger{color:var(--danger);border-color:#E9C2BC}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:none;color:var(--brand2);padding:0 6px}
.btn.ghost:hover{background:var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:550;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical}
.inp:focus{outline:2px solid var(--river);outline-offset:0;border-color:var(--river)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.search{position:relative}
.search .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .inp{padding-left:35px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip:hover{border-color:#B9C7BF}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip b{font-weight:600;opacity:.75}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--brand2)}

/* ---------- Статусы ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--pc) 13%,#fff);color:color-mix(in srgb,var(--pc) 78%,#000)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc)}
.pill.od{--pc:var(--danger)}
.st-new{--pc:var(--s-new)}.st-assigned{--pc:var(--s-assigned)}.st-inwork{--pc:var(--s-inwork)}.st-done{--pc:var(--s-done)}.st-closed{--pc:var(--s-closed)}.st-rejected{--pc:var(--s-rejected)}
.c-good{--pc:var(--c-good)}.c-fair{--pc:var(--c-fair)}.c-care{--pc:var(--c-care)}.c-critical{--pc:var(--c-critical)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:550;color:var(--danger)}
.tag .ic{width:14px;height:14px}
.tag.ok{color:var(--c-good)}.tag.warn{color:var(--warn)}.tag.calm{color:var(--ink2)}

/* ---------- Панель со списком ---------- */
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.ptabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:46px;border:0;background:none;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--brand);border-color:var(--brand2)}
.ptabs b{font-weight:600;font-size:12px;background:var(--line2);border-radius:9px;padding:1px 7px;color:var(--ink2)}
.pfilters{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);flex:none}
.pfilters .line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pfilters select.inp{height:34px;width:auto;flex:1}
.plist{flex:1;overflow:auto;padding:8px}
.card{display:flex;gap:11px;width:100%;text-align:left;padding:11px;border:1px solid transparent;border-radius:var(--r);background:none}
.card:hover{background:#F4F7F5}
.card.sel{background:var(--brand-soft);border-color:#BFDfD0}
.card+.card{margin-top:2px}
.cicon{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pc) 14%,#fff);color:color-mix(in srgb,var(--pc) 80%,#000)}
.cbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.ctitle{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ctitle span:last-child{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.cdesc{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.caddr{font-size:12.5px;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .ic{width:30px;height:30px;margin-bottom:8px;color:#A9B8B0}

/* ---------- Карта: элементы поверх ---------- */
.map-search{position:absolute;top:12px;left:12px;z-index:5;width:min(330px,calc(100% - 80px))}
.map-search .inp{height:42px;border:0;box-shadow:var(--shadow);border-radius:11px;padding-left:38px}
.map-search .ic{top:12px;left:13px}
.geo-res{margin-top:6px;background:#fff;border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.geo-res button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 13px;font-size:13px;border-top:1px solid var(--line2)}
.geo-res button:first-child{border-top:0}
.geo-res button:hover{background:#F4F7F5}
.geo-res div{padding:9px 13px;font-size:13px;color:var(--muted)}
.map-tools{position:absolute;top:86px;right:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.mtool{width:34px;height:34px;border-radius:6px;border:2px solid rgba(0,0,0,.2);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;background-clip:padding-box}
.mtool:hover{background:#F2F5F3}
.mtool.on{background:var(--brand);color:#fff}
.legend{position:absolute;left:12px;bottom:22px;z-index:5;background:rgba(255,255,255,.96);border-radius:11px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px}
.legend h3{font-size:12px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.legend h3 button{border:0;background:none;color:var(--muted);padding:0;display:flex}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.legend i.sq{border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.legend i.od{background:#fff;box-shadow:0 0 0 2px var(--danger)}
.legend .sep{grid-column:1/-1;height:1px;background:var(--line);margin:3px 0}
.legend-btn{position:absolute;left:12px;bottom:22px;z-index:5}
.fab{position:absolute;right:14px;bottom:26px;z-index:5;height:48px;padding:0 18px 0 14px;border-radius:24px;border:0;background:var(--sun);color:#2A2000;font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(120,85,0,.35)}
.fab:hover{filter:brightness(1.05)}
.pick-banner{position:absolute;top:66px;left:12px;z-index:5;background:var(--brand);color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 70px)}
.list-toggle{display:none;position:absolute;left:12px;top:64px;z-index:5}

/* Метки */
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff}
.pin .ic{transform:rotate(45deg);width:17px;height:17px}
.pin.od{box-shadow:0 0 0 3px var(--danger),0 3px 8px rgba(0,0,0,.35)}
.pin.sel{width:38px;height:38px;margin:-3px 0 0 -3px;box-shadow:0 0 0 4px rgba(18,38,31,.85),0 3px 10px rgba(0,0,0,.4)}
.pin.dim{opacity:.55}
.dot{position:relative;width:24px;height:24px;border-radius:50%;background:var(--pc);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff}
.dot .ic{width:14px;height:14px;stroke-width:2.2}
.dot.zone{width:30px;height:30px;border-radius:9px}
.dot.zone .ic{width:17px;height:17px}
.dot.sel{box-shadow:0 0 0 4px rgba(18,38,31,.85),0 2px 6px rgba(0,0,0,.4)}
.dot.need::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.draft-pin{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--sun);border:3px solid #2A2000;box-shadow:0 4px 12px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#2A2000}
.draft-pin .ic{transform:rotate(45deg)}
.me-dot{width:16px;height:16px;border-radius:50%;background:#2A7DE1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,125,225,.25)}
.leaflet-container{font-family:var(--font)!important}
.leaflet-tooltip{font-size:12px;font-weight:500;border-radius:7px;padding:4px 8px}

/* ---------- Выдвижная карточка ---------- */
.drawer{position:fixed;top:106px;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);box-shadow:-10px 0 34px rgba(14,59,46,.18);z-index:30;display:none;flex-direction:column}
.drawer.on{display:flex}
.d-head{flex:none;display:flex;gap:10px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.d-head .cicon{width:42px;height:42px;border-radius:11px}
.d-head .cicon .ic{width:22px;height:22px}
.d-title{flex:1;min-width:0}
.d-title h2{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.d-title p{font-size:12.5px;color:var(--muted);margin-top:2px}
.d-close{width:32px;height:32px;border-radius:8px;border:0;background:var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.d-close:hover{background:var(--line)}
.d-body{flex:1;overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px}
.d-sec h3{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.linkbtn{border:0;background:none;padding:0;color:var(--river);font-weight:550;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* Путь обращения */
.steps{display:flex;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{flex:1;position:relative;text-align:center;font-size:11.5px;color:var(--muted);padding-top:30px;counter-increment:s;line-height:1.25}
.steps li::before{content:counter(s);position:absolute;top:0;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:1;box-sizing:border-box}
.steps li::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.ok{color:var(--ink2)}
.steps li.ok::before{content:"✓";background:var(--brand2);border-color:var(--brand2);color:#fff}
.steps li.ok::after,.steps li.cur::after{background:var(--brand2)}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur::before{border-color:var(--brand2);color:var(--brand2);box-shadow:0 0 0 4px var(--brand-soft)}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos.one{grid-template-columns:1fr}
.photo{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:0;padding:0;background:#E6ECE8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7C8C84;font-size:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.test{background:repeating-linear-gradient(135deg,#E8EDEA 0 12px,#DFE6E2 12px 24px)}
.photo.test.after{background:repeating-linear-gradient(135deg,#E1F0E7 0 12px,#D5E9DD 12px 24px);color:#4E7C63}
.photo.test .ic{width:34px;height:34px}
.photo.none{border:1.5px dashed var(--line);background:none}
.ph-tag{position:absolute;left:7px;top:7px;background:rgba(18,38,31,.82);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px}
.actions{background:#F5F8F6;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:11px}
.actions .btns{display:flex;gap:8px;flex-wrap:wrap}
.actions .btns .btn{flex:1 1 auto}
.next-hint{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink2)}
.next-hint .ic{color:var(--river);margin-top:1px}
.note{font-size:13px;padding:9px 11px;border-radius:9px;background:var(--warn-soft);color:#5E3D00}
.note.red{background:var(--danger-soft);color:#7A1F15}
.note.green{background:var(--brand-soft);color:#0B4A35}
.upload{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upload input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.upload .thumb{width:74px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.upload .thumb.t{display:flex;align-items:center;justify-content:center;font-size:10.5px;text-align:center;line-height:1.15;color:#5d6f67;background:repeating-linear-gradient(135deg,#E8EDEA 0 8px,#DFE6E2 8px 16px)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cat{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-size:13px;font-weight:500;line-height:1.2}

.cat.on{border-color:var(--brand2);background:var(--brand-soft)}

.loc{display:flex;gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.loc .ic{color:var(--brand2)}
.loc b{display:block;font-weight:600}
.loc small{color:var(--muted);font-size:12px}
.timeline{list-style:none;margin:0;padding:0}

.timeline li::before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--brand2)}
.timeline li::after{content:"";position:absolute;left:6.5px;top:15px;bottom:-3px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline time{display:block;font-size:11.5px;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;text-align:left;width:100%}
button.mini-row:hover{border-color:#B9C7BF;background:#F8FAF8}
.mini-row .ic{color:var(--brand2)}
.mini-row .grow{flex:1;min-width:0}
.mini-row small{display:block;color:var(--muted);font-size:12px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.guide li b{display:block}
.guide li .btn{margin-top:6px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.toolbar select.inp{width:auto}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#F8FAF8}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F6F9F7}
td.id{font-weight:600;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;max-width:44ch}
.cell-ic{display:flex;gap:8px;align-items:flex-start}
.cell-ic .ic{color:var(--brand2);margin-top:1px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;text-align:left;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--tc,var(--line))}
button.tile:hover{border-color:#B9C7BF;border-left-color:var(--tc,var(--line))}
.tile span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile span .ic{width:15px;height:15px}
.tile b{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-width:0}
.box h2{font-size:15px;font-weight:650;margin-bottom:3px}
.box>p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--pc);border-radius:0 4px 4px 0;min-width:2px}
.bar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar span{display:flex;align-items:center;gap:6px;min-width:0}
.bar span .ic{width:15px;height:15px;color:var(--ink2)}
.trend{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.trend .day{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative}
.trend .col{width:38%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.trend .col.in{background:var(--river)}
.trend .col.out{background:#3BA36A}
.trend .col i{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.trend-x{display:flex;gap:10px;margin-top:5px}
.trend-x span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px}

.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:220px;display:flex;flex-direction:column;min-width:0}

.daycol.today .dayhead b{color:var(--brand2)}
.daybody{padding:7px;display:flex;flex-direction:column;gap:6px;flex:1}
.task{border:1px solid var(--line);border-left:3px solid var(--river);border-radius:8px;padding:7px 8px;font-size:12.5px;background:#fff;display:flex;flex-direction:column;gap:3px}

.task.late{background:var(--danger-soft);border-color:#EBC4BE;border-left-color:var(--danger)}
.task-h{display:flex;align-items:center;gap:5px;font-weight:600}
.task-h .ic{width:15px;height:15px}
.task button.linkbtn{font-weight:500;font-size:12.5px}
.task small{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:4px}
.task small .ic{width:12px;height:12px}
.task .btn{height:27px;font-size:12px;padding:0 8px;margin-top:2px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav b{min-width:150px;text-align:center;font-weight:600}
.late-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:14px}

.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:pop .22s ease-out}
.toast.err{background:var(--danger)}
.toast.ok .ic{color:#7DE0AE}

#modal{position:fixed;inset:0;z-index:70;background:rgba(10,25,20,.62);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal img{max-width:100%;max-height:100%;border-radius:10px}
.dialog{background:#fff;border-radius:14px;padding:20px;max-width:400px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-size:17px}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end}

  .list-toggle{display:inline-flex}

  .page-in{padding:16px 14px 40px}
  .week{grid-template-columns:1fr}
  .steps li{font-size:10.5px}
  .daycol{min-height:0}
  .legend ul{grid-template-columns:1fr}
  .fab{bottom:20px}
  .bar{grid-template-columns:112px 1fr 26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const ck = (lat, lng) => lat.toFixed(5) + ',' + lng.toFixed(5);
async function reverseGeo(lat, lng) {
  const k = ck(lat, lng);

  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ru`);

  const road = a.road || a.pedestrian || a.footway || a.path || '';
  const area = a.neighbourhood || a.suburb || a.quarter || a.city_district || '';
  let s = road ? road + (a.house_number ? ', ' + a.house_number : '') : (j.name || area || '');
  if (road && !a.house_number && area) s += ' (' + area + ')';
  if (!s) s = (j.display_name || '').split(',').slice(0, 2).join(',').trim();
  if (s) { addrCache[k] = s; writeLS(KEY + '-addr', addrCache); }
  return s;
}
const geoQ = []; let geoBusy = false, geoFail = 0;
function queueAddr(items) {
  items.forEach(it => {
    if (it.addr) return;
    const c = addrCache[ck(it.lat, it.lng)];
    if (c) { it.addr = c; return; }
    if (!geoQ.includes(it)) geoQ.push(it);
  });
  pumpGeo();
}
async function pumpGeo() { // не чаще одного запроса в секунду — правило сервиса Nominatim
  if (geoBusy) return; geoBusy = true;
  while (geoQ.length && geoFail < 3) {
    const it = geoQ.shift();
    try {
      const s = await reverseGeo(it.lat, it.lng);
      if (s) { it.addr = s; document.querySelectorAll(`[data-addr="${it.id}"]`).forEach(el => { el.textContent = s; }); }
    } catch (e) { geoFail++; }
    await new Promise(r => setTimeout(r, 1100));
  }
  if (!geoQ.length) save();
  geoBusy = false;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.innerHTML = ic(type === 'err' ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
  const box = $('#toasts');
  while (box.children.length >= 2) box.firstChild.remove();
  box.appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 5200 : 3400);
}

function readPhoto(file) { // уменьшаем снимок, чтобы он помещался в память браузера
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });

  'open-object'(d) { openObject(d.id); },
  close() { closeDrawer(); },
  show(d) { const it = d.kind === 'appeal' ? apById(d.id) : obById(d.id); setView('map'); if (d.kind === 'appeal') { ui.tab = 'appeals'; ui.f = { cat: 'all', status: isOpen(it) ? 'active' : 'all', overdue: false, q: '' }; } else { ui.tab = 'objects'; ui.of = { type: 'all', cond: 'all', need: false, q: '' }; } render(); setTimeout(() => flyTo(it), 60); },
  form(d) {
    ui.form = d.form; ui.draft = {};
    const it = ui.drawer.t === 'appeal' ? apById(ui.drawer.id) : obById(ui.drawer.id);
    if (d.form === 'assign') ui.draft = { ex: it.assignee || (['dump', 'bins'].includes(it.cat) ? 'ex2' : 'ex3'), dl: toInput(it.deadline || Date.now() + 2 * D), pr: it.priority };
    if (d.form === 'plan') ui.draft = { kind: 'water', date: today(), ex: 'ex3', repeat: 0 };
    if (d.form === 'move') return startPick(it.lat, it.lng);
    render();
  },
  'form-cancel'() { ui.form = null; ui.draft = {}; clearDraft(); render(); },
  'assign-save'(d) {
    const a = apById(d.id), dl = new Date(ui.draft.dl).getTime();
    if (!dl || isNaN(dl)) return toast('Укажите срок выполнения.', 'err');
    if (dl < Date.now()) return toast('Срок уже прошёл. Выберите дату в будущем.', 'err');
    const re = a.status !== 'new';
    a.assignee = ui.draft.ex; a.deadline = dl; a.priority = ui.draft.pr || 'normal';
    if (!re) a.status = 'assigned';
    log(a, `${re ? 'Назначение изменено' : 'Назначен исполнитель'}: ${exName(a.assignee)}. Срок: ${fDT(dl)}`);
    ui.form = null; ui.draft = {}; save(); render(); toast(`${a.id}: назначен исполнитель «${exShort(a.assignee)}»`);
  },
  'reject-save'(d) {
    const a = apById(d.id), r = (ui.draft.reason || '').trim();
    if (r.length < 5) return toast('Напишите причину отклонения: её увидит житель.', 'err');
    a.status = 'rejected'; a.rejectReason = r; a.closedAt = Date.now(); log(a, 'Отклонено. ' + r);
    ui.form = null; save(); render(); toast(`${a.id}: обращение отклонено`);
  },
  take(d) { const a = apById(d.id); a.status = 'inwork'; log(a, 'Принято в работу'); save(); render(); toast(`${a.id}: принято в работу`); },
  'report-save'(d) {
    const a = apById(d.id);
    if (!ui.draft.photo) return toast('Приложите фото результата: без него оператор не сможет проверить работу.', 'err');
    a.status = 'done'; a.doneAt = Date.now(); a.donePhoto = ui.draft.photo; a.doneNote = (ui.draft.note || '').trim();
    log(a, 'Работы выполнены, приложено фото' + (a.doneNote ? '. ' + a.doneNote : ''));
    ui.form = null; ui.draft = {}; save(); render(); toast(`${a.id}: отчёт отправлен оператору на проверку`);
  },
  accept(d) { const a = apById(d.id); a.status = 'closed'; a.closedAt = Date.now(); log(a, 'Результат проверен по фото, обращение закрыто'); save(); render(); toast(`${a.id}: обращение закрыто`); },
  'return-save'(d) {
    const a = apById(d.id), r = (ui.draft.reason || '').trim();
    if (r.length < 5) return toast('Напишите, что нужно доделать.', 'err');
    a.status = 'inwork'; a.donePhoto = null; a.doneAt = null; a.doneNote = ''; log(a, 'Возвращено на доработку. ' + r);
    ui.form = null; save(); render(); toast(`${a.id}: возвращено исполнителю на доработку`);
  },
  'new-appeal'() {
    if (ui.role !== 'resident') { ui.role = 'resident'; saveUI(); }
    clearDraft(); ui.drawer = { t: 'new-appeal' }; ui.form = null; ui.draft = {}; ui.tab = 'appeals'; startPick();
  },
  'new-object'() { clearDraft(); ui.drawer = { t: 'new-object' }; ui.form = null; ui.draft = { type: 'tree' }; ui.tab = 'objects'; startPick(); },
  'draft-set'(d) { ui.draft[d.k] = d.v; renderDrawer(); },
  'test-photo'() { ui.draft.photo = 'test'; renderDrawer(); },
  'appeal-submit'() {
    const d = ui.draft, miss = [];
    if (!d.cat) miss.push('выберите, что случилось');
    if (!(d.desc || '').trim()) miss.push('добавьте описание');
    if (!d.photo) miss.push('приложите фото');
    if (d.lat == null) miss.push('укажите место на карте');
    if (miss.length) return toast('Чтобы отправить обращение, ' + miss.join(', ') + '.', 'err');
    const a = { id: 'ЭК-' + String(++db.seq.a).padStart(4, '0'), cat: d.cat, lat: d.lat, lng: d.lng, desc: d.desc.trim(), addr: d.addr || '', author: 'me', createdAt: Date.now(), status: 'new', priority: 'normal', assignee: null, deadline: null, photo: d.photo, donePhoto: null, doneNote: '', history: [], test: d.photo === 'test' };
    log(a, 'Обращение зарегистрировано'); db.appeals.push(a); save();
    clearDraft(); ui.f = { cat: 'all', status: 'active', overdue: false, q: '' };
    openAppeal(a.id); toast(`Обращение ${a.id} зарегистрировано`);
  },
  'object-submit'() {
    const d = ui.draft, t = d.type || 'tree', name = (d.name || '').trim();
    if (!name) return toast(t === 'tree' ? 'Укажите породу дерева.' : 'Укажите название территории.', 'err');
    if (d.lat == null) return toast('Укажите место на карте.', 'err');
    const o = { id: 'ЗФ-' + String(++db.seq.o).padStart(4, '0'), type: t, name, species: t === 'tree' ? name : '', year: t === 'tree' && +d.year ? +d.year : null, lat: d.lat, lng: d.lng, addr: d.addr || '', radius: t === 'tree' ? 0 : Math.min(500, Math.max(10, +d.radius || 50)), condition: d.cond || 'good', lastWater: Date.now(), waterEvery: +(d.water || 7), lastInspect: Date.now(), note: '', history: [], test: false };
    log(o, 'Объект добавлен в реестр. Состояние «' + COND[o.condition].label.toLowerCase() + '»'); db.objects.push(o); save();
    clearDraft(); ui.of = { type: 'all', cond: 'all', need: false, q: '' };
    openObject(o.id); toast(`Объект ${o.id} добавлен в реестр`);
  },
  'inspect-save'(d) {
    const o = obById(d.id), c = ui.draft.cond || o.condition;
    o.condition = c; if (ui.draft.note != null) o.note = ui.draft.note.trim(); o.lastInspect = Date.now();
    log(o, 'Осмотр: состояние «' + COND[c].label.toLowerCase() + '»' + (o.note ? '. ' + o.note : ''));
    ui.form = null; ui.draft = {}; save(); render(); toast(`${o.id}: осмотр записан`);
  },
  'plan-new'() { clearDraft(); ui.drawer = { t: 'plan' }; ui.form = null; ui.draft = { obj: sortObjects(db.objects)[0].id, kind: 'water', date: today(), ex: 'ex3', repeat: 0 }; render(); },
  'plan-save'(d) {
    const dr = ui.draft, oid = d.id || dr.obj, o = obById(oid);
    if (!o) return toast('Выберите объект.', 'err');
    if (!dr.date) return toast('Укажите дату работ.', 'err');
    const t = { id: 'Р-' + String(++db.seq.t).padStart(4, '0'), objectId: oid, kind: dr.kind || 'water', date: dr.date, assignee: dr.ex || 'ex3', repeat: +dr.repeat || 0, status: 'planned', doneAt: null, note: '' };
    db.tasks.push(t); log(o, `Запланировано: ${KINDS[t.kind].label.toLowerCase()} на ${fD(dparse(t.date))}, ${exShort(t.assignee)}`);
    ui.form = null; ui.draft = {}; if (ui.drawer && ui.drawer.t === 'plan') ui.drawer = null;
    save(); render(); toast(`${KINDS[t.kind].label} добавлен${t.kind === 'water' || t.kind === 'inspect' ? '' : 'а'} в план на ${fD(dparse(t.date))}`);
  },
  'move-save'(d) {
    const o = obById(d.id);
    if (ui.draft.lat != null) { o.lat = ui.draft.lat; o.lng = ui.draft.lng; o.addr = ui.draft.addr || ''; log(o, 'Уточнено место на карте'); }
    clearDraft(); ui.form = null; ui.draft = {}; save(); queueAddr([o]); render(); toast(`${o.id}: место обновлено`);
  },
  'water-now'(d) { const o = obById(d.id); o.lastWater = Date.now(); log(o, 'Отмечен полив'); save(); render(); toast(`${o.id}: полив отмечен`); },
  'task-done'(d) {
    const t = db.tasks.find(x => x.id === d.id), o = obById(t.objectId);
    t.status = 'done'; t.doneAt = Date.now();
    if (o) {
      if (t.kind === 'water') o.lastWater = Date.now();
      if (t.kind === 'inspect') o.lastInspect = Date.now();
      log(o, `Выполнено: ${KINDS[t.kind].label.toLowerCase()} (${exShort(t.assignee)})`);
    }
    let next = '';
    if (t.repeat) {
      let nd = addDays(t.date, t.repeat); while (nd <= today()) nd = addDays(nd, t.repeat);
      db.tasks.push({ id: 'Р-' + String(++db.seq.t).padStart(4, '0'), objectId: t.objectId, kind: t.kind, date: nd, assignee: t.assignee, repeat: t.repeat, status: 'planned', doneAt: null, note: '' });
      next = `. Следующий раз: ${fD(dparse(nd))}`;
    }
    save(); render(); toast(`${KINDS[t.kind].label}: выполнено${next}`);
  },
  week(d) { ui.pl.week = +d.d ? ui.pl.week + +d.d : 0; render(); },
  dq(d) { setView('appeals'); ui.pf = { status: d.status, cat: 'all', q: '', scope: 'all' }; render(); },
  gq(d) { ui.of.need = d.need === '1'; ui.of.cond = d.cond; render(); },
  export() { exportCSV(); },
  reset() { modal(`<div class="dialog"><h2>Вернуть тестовые данные?</h2><p>Все обращения, объекты и работы, добавленные во время показа, будут удалены. Система вернётся к исходному тестовому набору.</p><div class="btns"><button class="btn" data-act="modal-close">Отмена</button><button class="btn danger" data-act="reset-yes">Вернуть тестовые данные</button></div></div>`); },
  'reset-yes'() { db = seed(); save(); geoFail = 0; modal(''); clearDraft(); ui.drawer = null; ui.form = null; ui.draft = {}; queueAddr(db.appeals.concat(db.objects)); render(); toast('Тестовые данные восстановлены'); },
  'modal-close'() { modal(''); },
  zoom(d, el) { const img = $('img', el); if (img) modal(`<img src="${img.src}" alt="Фото крупно" data-act="modal-close">`); },
  base() { ui.base = ui.base === 'sat' ? 'scheme' : 'sat'; setBase(); renderMapOver(); },
  locate() { locate(); },
  home() { if (map) map.setView(CENTER, 14); },
  legend() { ui.legend = !ui.legend; renderMapOver(); },
  'list-toggle'() { ui.listOpen = !ui.listOpen; renderView(); },
  guide() { clearDraft(); ui.drawer = { t: 'guide' }; ui.form = null; render(); },
  'geo-go'(d) { $('#geoRes').classList.add('hide'); if (map) map.setView([+d.lat, +d.lng], 17); if (ui.pick) setDraftPos(+d.lat, +d.lng); }
};

/* ================= 11. События ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal') modal(''); return; }
  if (el.tagName === 'TR' && e.target.closest('button,a')) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) modal(''); else if (ui.drawer) closeDrawer(); }
  if (e.key === 'Enter' && e.target.tagName === 'TR' && e.target.dataset.act) ACT[e.target.dataset.act](e.target.dataset, e.target);
  if (e.key === 'Enter' && e.target.id === 'geoq') { e.preventDefault(); geoSearch(e.target.value); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) { ui.draft[t.dataset.bind] = t.value; return; }
  if (t.dataset.f) { setPath(t.dataset.f, t.value.trim()); if (ui.view === 'map') { renderList(); drawMarkers(); } else renderPageBody(); return; }
  if (t.id === 'geoq') { clearTimeout(geoTimer); const v = t.value; if (v.trim().length < 3) $('#geoRes').classList.add('hide'); else geoTimer = setTimeout(() => geoSearch(v), 700); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.photo) {
    const f = t.files && t.files[0]; if (!f) return;
    readPhoto(f).then(src => { ui.draft.photo = src; renderDrawer(); }).catch(() => toast('Не удалось прочитать фото. Выберите файл JPG или PNG.', 'err'));
    return;
  }
  const c = t.dataset.chg; if (!c) return;
  if (c === 'role') return ACT.role({ role: t.value });
  if (c === 'executor') { ui.executor = t.value; ui.pl.ex = t.value; saveUI(); render(); return; }
  if (c === 'pf.scope') ui.pf.scope = t.checked ? 'all' : 'role';
  else setPath(c, t.type === 'checkbox' ? t.checked : t.value);
  render();
});
let geoTimer = 0;
async function geoSearch(q) {
  q = q.trim(); const box = $('#geoRes'); if (q.length < 3) return;
  box.classList.remove('hide'); box.innerHTML = '<div>Ищем…</div>';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${CITY_BOX}&bounded=1&limit=5&accept-language=ru`);
    const j = await r.json();
    box.innerHTML = j.length ? j.map(x => `<button data-act="geo-go" data-lat="${x.lat}" data-lng="${x.lon}">${esc(x.display_name.split(',').slice(0, 3).join(','))}</button>`).join('') : '<div>В Кызылорде ничего не нашлось. Попробуйте название улицы.</div>';
  } catch (e) { box.innerHTML = '<div>Поиск адресов недоступен: нет связи с сервисом.</div>'; }
}
window.addEventListener('storage', e => { // второе окно: житель и оператор видят изменения друг друга
  if (e.key !== KEY) return;
  const d = load(); if (!d) return;
  const before = db.appeals.length; db = d;
  if (ui.drawer && ((ui.drawer.t === 'appeal' && !apById(ui.drawer.id)) || (ui.drawer.t === 'object' && !obById(ui.drawer.id)))) ui.drawer = null;
  if (!ui.form && !(ui.drawer && /^new|plan/.test(ui.drawer.t))) render(); else { renderTop(); drawMarkers(); }
  toast(db.appeals.length > before ? 'Поступило новое обращение' : 'Данные обновлены в другом окне');
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x.id === v) && v !== ui.view) { ui.view = v; render(); } });
setInterval(() => { if (!ui.form && !(ui.drawer && /^new|plan/.test(ui.drawer.t)) && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);

/* ================= 12. Запуск ================= */
const h0 = location.hash.slice(1);
if (VIEWS.some(v => v.id === h0)) ui.view = h0;
if (ui.role === 'executor') ui.pl.ex = ui.executor;
render();
loadLeaflet(ok => {
  if (ok) { initMap(); const off = $('#mapOff'); if (off) off.remove(); queueAddr(db.appeals.concat(db.objects.filter(o => o.radius), db.objects.filter(o => !o.radius))); }
  else { mapFailed = true; if (ui.view === 'map') renderMapOver(); }
});
})();
</script>
</body>
</html>
